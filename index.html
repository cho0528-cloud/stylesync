<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StyleSync- 날씨 맞춤 코디</title>
  
  <!-- PWA & 모바일 메타태그 -->
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">

  <!-- React & Tailwind CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #0b0b0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- IndexedDB ---
    const DB_NAME = 'StyleSyncDB';
    const STORE_NAME = 'wardrobe';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveItemToDB = async (item) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(item);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    };

    const getItemsFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    // --- Image Compression ---
    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    };

    function App() {
      const [weather, setWeather] = useState(null);
      const [loading, setLoading] = useState(true);
      const [items, setItems] = useState([]);

      const [name, setName] = useState('');
      const [category, setCategory] = useState('Top');
      const [minTemp, setMinTemp] = useState(10);
      const [maxTemp, setMaxTemp] = useState(25);
      const [image, setImage] = useState('');

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              const { latitude, longitude } = position.coords;
              try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                const data = await res.json();
                setWeather({
                  temp: Math.round(data.current_weather.temperature),
                  code: data.current_weather.weathercode,
                });
              } catch (e) {
                console.error(e);
              } finally {
                setLoading(false);
              }
            },
            () => {
              fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true')
                .then((res) => res.json())
                .then((data) => {
                  setWeather({
                    temp: Math.round(data.current_weather.temperature),
                    code: data.current_weather.weathercode,
                  });
                })
                .finally(() => setLoading(false));
            }
          );
        }
      }, []);

      useEffect(() => {
        getItemsFromDB().then((data) => {
          if (data) setItems(data);
        });
      }, []);

      const handleImageChange = async (e) => {
        if (e.target.files && e.target.files[0]) {
          const compressed = await compressImage(e.target.files[0]);
          setImage(compressed);
        }
      };

      const handleAddItem = async (e) => {
        e.preventDefault();
        if (!name || !image) return alert('의류 이름과 사진을 모두 등록해주세요.');

        const newItem = {
          id: Date.now().toString(),
          name,
          category,
          minTemp: Number(minTemp),
          maxTemp: Number(maxTemp),
          image,
        };

        await saveItemToDB(newItem);
        setItems((prev) => [...prev, newItem]);
        setName('');
        setImage('');
        alert('옷장에 성공적으로 추가되었습니다!');
      };

      const recommendedItems = weather
        ? items.filter((item) => weather.temp >= item.minTemp && weather.temp <= item.maxTemp)
        : [];

      return (
        <main className="min-h-screen max-w-md mx-auto p-4 pb-20 flex flex-col gap-6">
          <header className="flex justify-between items-center py-2 border-b border-gray-800">
            <h1 className="text-2xl font-black bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
              StyleSync
            </h1>
            <span className="text-xs bg-purple-900/50 text-purple-300 border border-purple-500/30 px-2.5 py-1 rounded-full font-medium">
              App Ready
            </span>
          </header>

          <section className="bg-gradient-to-br from-gray-900 to-gray-800 p-5 rounded-2xl border border-gray-800 shadow-xl">
            <h2 className="text-xs font-medium text-gray-400 uppercase tracking-wider">현재 기온</h2>
            {loading ? (
              <p className="text-lg mt-2 animate-pulse text-gray-400">날씨 불러오는 중...</p>
            ) : weather ? (
              <div className="flex items-baseline justify-between mt-2">
                <span className="text-5xl font-extrabold">{weather.temp}°C</span>
                <span className="text-xs text-gray-300 bg-gray-800/80 px-3 py-1.5 rounded-lg border border-gray-700">
                  {weather.temp <= 5 ? '❄️ 패딩 필수' : weather.temp <= 16 ? '🧥 자켓·가디건' : weather.temp <= 22 ? '👔 긴팔 셔츠' : '☀️ 시원한 반팔'}
                </span>
              </div>
            ) : (
              <p className="text-sm text-red-400 mt-2">날씨 정보 로드 실패</p>
            )}
          </section>

          <div className="w-full h-16 bg-gray-900/40 border border-dashed border-gray-800 rounded-xl flex items-center justify-center text-xs text-gray-500">
            Google AdSense Banner Area
          </div>

          <section>
            <h2 className="text-lg font-bold mb-3 flex items-center gap-2">
              <span>오늘의 추천 코디</span>
              <span className="text-xs bg-purple-500/20 text-purple-400 px-2 py-0.5 rounded-full">{recommendedItems.length}개</span>
            </h2>

            {recommendedItems.length === 0 ? (
              <div className="text-center py-8 bg-gray-900/30 rounded-2xl border border-gray-800/60 p-4">
                <p className="text-sm text-gray-400">현재 기온({weather?.temp ?? '-'}°C)에 알맞은 옷이 없습니다.</p>
                <p className="text-xs text-gray-500 mt-1">아래에서 새 옷을 등록해 보세요!</p>
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-3">
                {recommendedItems.map((item) => (
                  <div key={item.id} className="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 shadow-md">
                    <img src={item.image} alt={item.name} className="w-full h-36 object-cover" />
                    <div className="p-3">
                      <span className="text-[10px] text-purple-400 font-bold uppercase">{item.category}</span>
                      <p className="font-semibold text-sm truncate text-gray-100">{item.name}</p>
                      <p className="text-xs text-gray-400 mt-1">{item.minTemp}°C ~ {item.maxTemp}°C</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>

          <section className="bg-gray-900/60 p-5 rounded-2xl border border-gray-800">
            <h2 className="text-base font-bold mb-4">내 옷장에 옷 추가하기</h2>
            <form onSubmit={handleAddItem} className="space-y-4">
              <div>
                <label className="text-xs text-gray-400 block mb-1">의류 이름</label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="예: 청자켓, 맨투맨"
                  className="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm focus:outline-none text-white"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-gray-400 block mb-1">카테고리</label>
                  <select
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    className="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm focus:outline-none text-white"
                  >
                    <option value="Top">상의</option>
                    <option value="Bottom">하의</option>
                    <option value="Outer">아우터</option>
                    <option value="Shoes">신발</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs text-gray-400 block mb-1">사진 업로드</label>
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleImageChange}
                    className="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white cursor-pointer"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-gray-400 block mb-1">최저 착용 기온 (°C)</label>
                  <input
                    type="number"
                    value={minTemp}
                    onChange={(e) => setMinTemp(Number(e.target.value))}
                    className="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-white"
                  />
                </div>
                <div>
                  <label className="text-xs text-gray-400 block mb-1">최고 착용 기온 (°C)</label>
                  <input
                    type="number"
                    value={maxTemp}
                    onChange={(e) => setMaxTemp(Number(e.target.value))}
                    className="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-sm text-white"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="w-full mt-2 bg-gradient-to-r from-purple-600 to-pink-600 font-bold py-3.5 rounded-xl text-sm text-white shadow-lg"
              >
                옷장에 등록하기
              </button>
            </form>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
</html>
