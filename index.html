<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StyleSync</title>
  
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">

  <!-- React 및 Tailwind CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #0b0b0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- STRICT CATEGORY SYSTEM ---
    const CORE_KO = ["상의", "하의", "아우터", "신발", "악세서리"];
    const CORE_EN = ["Top", "Bottom", "Outer", "Shoes", "Accessory"];
    const CORE_ICO = ["👕", "👖", "🧥", "👟", "💍"];
    const CI = { TOP: 0, BOTTOM: 1, OUTER: 2, SHOES: 3, ACC: 4 };

    // --- IndexedDB Helper ---
    const DB_NAME = "stylesync_db";
    const DB_STORE = "clothes";
    const DB_VERSION = 1;
    const DEFAULT_CITY = "Seoul";

    const openDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = (event) => resolve(event.target.result);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE, { keyPath: "id" });
          }
        };
      });
    };

    const getAllClothes = async () => {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, "readonly");
          const store = tx.objectStore(DB_STORE);
          const request = store.getAll();
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result || []);
        });
      } catch {
        return [];
      }
    };

    const saveClothes = async (clothes) => {
      try {
        const db = await openDB();
        const tx = db.transaction(DB_STORE, "readwrite");
        const store = tx.objectStore(DB_STORE);
        store.clear();
        clothes.forEach((item) => store.put(item));
        return new Promise((resolve, reject) => {
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch {}
    };

    // --- Image Compression (Canvas API - max 600px, quality 0.6) ---
    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const MAX_WIDTH = 600;
            const QUALITY = 0.6;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height = (height * MAX_WIDTH) / width;
              width = MAX_WIDTH;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            if (!ctx) return reject(new Error("Canvas not supported"));
            ctx.drawImage(img, 0, 0, width, height);
            const compressedDataUrl = canvas.toDataURL("image/jpeg", QUALITY);
            resolve(compressedDataUrl);
          };
          img.onerror = () => reject(new Error("Image load failed"));
          img.src = e.target.result;
        };
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    };

    // --- INTERNATIONALIZATION (i18n) ---
    const TEXTS = {
      ko: {
        categories: CORE_KO,
        weatherLoading: "날씨 확인 중...",
        gps: "GPS",
        cityPlaceholder: "도시명",
        go: "GO",
        upload: "사진 업로드",
        recommendTitle: "오늘의 추천 코디",
        recommendDesc: (temp) => `${temp}°C 날씨에 맞춘 조합입니다.`,
        retry: "다시 추천받기",
        toastAdded: (n) => `${n}개 추가 완료`,
        toastWeatherError: "날씨 오류",
        toastNetworkError: "네트워크 오류",
        toastCityNotFound: "지역을 찾을 수 없습니다.",
        toastNoGPS: "GPS 불가",
        toastPermission: "위치 권한 필요",
        toastSelectCategory: "카테고리 선택 필요",
        toastWeatherLoading: "날씨 로딩 중",
        toastAddClothes: "옷을 먼저 추가하세요",
        weatherClear: "맑음",
        weatherPartly: "구름 조금",
        weatherCloudy: "흐림",
        weatherRain: "비",
        weatherSnow: "눈",
        weatherShower: "소나기",
        weatherStorm: "뇌우",
      },
      en: {
        categories: CORE_EN,
        weatherLoading: "Checking weather...",
        gps: "GPS",
        cityPlaceholder: "City name",
        go: "GO",
        upload: "Upload Photos",
        recommendTitle: "Today's Outfit",
        recommendDesc: (temp) => `Outfit for ${temp}°C weather.`,
        retry: "Try Again",
        toastAdded: (n) => `${n} item(s) added`,
        toastWeatherError: "Weather error",
        toastNetworkError: "Network error",
        toastCityNotFound: "City not found.",
        toastNoGPS: "GPS unavailable",
        toastPermission: "Location permission required",
        toastSelectCategory: "Select a category first",
        toastWeatherLoading: "Loading weather...",
        toastAddClothes: "Add clothes first",
        weatherClear: "Clear",
        weatherPartly: "Partly Cloudy",
        weatherCloudy: "Cloudy",
        weatherRain: "Rain",
        weatherSnow: "Snow",
        weatherShower: "Shower",
        weatherStorm: "Storm",
      },
    };

    const cleanCityName = (name) => {
      return name.replace(/(전라북도|전라남도|경상북도|경상남도|충청북도|충청남도|경기도|강원도|전북|전남|경북|경남|충북|충남|강원)/g, "").trim();
    };

    const getWeatherInfo = (code, lang) => {
      const t = TEXTS[lang];
      if (code === 0) return { label: t.weatherClear, emoji: "☀️" };
      if (code <= 2) return { label: t.weatherPartly, emoji: "⛅" };
      if (code <= 48) return { label: t.weatherCloudy, emoji: "☁️" };
      if (code <= 67) return { label: t.weatherRain, emoji: "🌧️" };
      if (code <= 77) return { label: t.weatherSnow, emoji: "❄️" };
      if (code <= 82) return { label: t.weatherShower, emoji: "🌦️" };
      if (code <= 87) return { label: t.weatherStorm, emoji: "🌩️" };
      return { label: t.weatherClear, emoji: "☀️" };
    };

    // 광고 배너 컴포넌트
    const AdBanner = ({ text }) => (
      <div className="w-full py-2 bg-gray-900/60 border border-dashed border-gray-800 rounded-xl text-center text-xs text-gray-500 my-2">
        {text || "ADVERTISEMENT"}
      </div>
    );

    // --- MAIN COMPONENT ---
    function StyleSync() {
      const [lang] = useState(() => (typeof window !== "undefined" && navigator.language.startsWith("ko") ? "ko" : "en"));
      const t = TEXTS[lang];
      const categories = t.categories;

      const [clothes, setClothes] = useState([]);
      const [dbReady, setDbReady] = useState(false);
      const [weather, setWeather] = useState(null);
      const [weatherLoading, setWeatherLoading] = useState(false);
      const [cityInput, setCityInput] = useState("");
      const [uploadCat, setUploadCat] = useState(null);
      const [outfitItems, setOutfitItems] = useState([]);
      const [outfitLoading, setOutfitLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const fileRef = useRef(null);

      useEffect(() => {
        getAllClothes().then((data) => {
          setClothes(data);
          setDbReady(true);
        });
      }, []);

      useEffect(() => {
        if (dbReady) saveClothes(clothes);
      }, [clothes, dbReady]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const fetchWeatherByCoords = async (lat, lon) => {
        setWeatherLoading(true);
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
          const data = await res.json();
          setWeather({
            city: "현위치",
            temp: Math.round(data.current_weather.temperature),
            code: data.current_weather.weathercode,
          });
        } catch {
          showToast(t.toastWeatherError);
        } finally {
          setWeatherLoading(false);
        }
      };

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude),
            () => fetchWeatherByCoords(37.5665, 126.978)
          );
        } else {
          fetchWeatherByCoords(37.5665, 126.978);
        }
      }, []);

      const handleFileUpload = async (e) => {
        if (!uploadCat) return showToast(t.toastSelectCategory);
        const files = Array.from(e.target.files || []);
        if (!files.length) return;

        const newItems = [];
        for (const file of files) {
          try {
            const compressed = await compressImage(file);
            newItems.push({
              id: Date.now() + Math.random(),
              name: file.name.split(".")[0],
              category: uploadCat,
              imageUrl: compressed,
            });
          } catch (err) {
            console.error(err);
          }
        }

        setClothes((prev) => [...prev, ...newItems]);
        showToast(t.toastAdded(newItems.length));
        if (fileRef.current) fileRef.current.value = "";
      };

      const generateOutfit = () => {
        if (!clothes.length) return showToast(t.toastAddClothes);
        setOutfitLoading(true);
        setTimeout(() => {
          const shuffled = [...clothes].sort(() => 0.5 - Math.random());
          setOutfitItems(shuffled.slice(0, 3));
          setOutfitLoading(false);
        }, 400);
      };

      const weatherDetails = weather ? getWeatherInfo(weather.code, lang) : null;

      return (
        <main className="min-h-screen max-w-md mx-auto p-4 pb-20 flex flex-col gap-5">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 bg-purple-600 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 animate-bounce">
              {toast}
            </div>
          )}

          {/* Header */}
          <header className="flex justify-between items-center py-2 border-b border-gray-800">
            <h1 className="text-2xl font-black bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
              StyleSync
            </h1>
            <span className="text-xs bg-purple-900/50 text-purple-300 border border-purple-500/30 px-2.5 py-1 rounded-full font-medium">
              PWA Active
            </span>
          </header>

          {/* Weather Info */}
          <section className="bg-gradient-to-br from-gray-900 to-gray-800 p-5 rounded-2xl border border-gray-800 shadow-xl">
            <div className="flex justify-between items-center text-xs text-gray-400 mb-2">
              <span>{weather?.city || "위치 확인 중"}</span>
              <span>{weatherDetails?.emoji} {weatherDetails?.label}</span>
            </div>
            {weatherLoading ? (
              <p className="text-sm text-gray-400 animate-pulse">{t.weatherLoading}</p>
            ) : (
              <div className="text-4xl font-black">{weather?.temp ?? "--"}°C</div>
            )}
          </section>

          <AdBanner text="SPONSORED AD" />

          {/* Category Upload Section */}
          <section className="bg-gray-900/60 p-4 rounded-2xl border border-gray-800">
            <h2 className="text-sm font-bold mb-3">{t.upload}</h2>
            <div className="grid grid-cols-5 gap-1.5 mb-3">
              {categories.map((cat, idx) => (
                <button
                  key={cat}
                  onClick={() => setUploadCat(cat)}
                  className={`p-2 rounded-xl text-center border transition-all ${
                    uploadCat === cat
                      ? "bg-purple-600 border-purple-400 text-white font-bold"
                      : "bg-gray-800 border-gray-700 text-gray-400"
                  }`}
                >
                  <div className="text-base mb-1">{CORE_ICO[idx]}</div>
                  <div className="text-[10px] truncate">{cat}</div>
                </button>
              ))}
            </div>

            <input
              type="file"
              ref={fileRef}
              onChange={handleFileUpload}
              multiple
              accept="image/*"
              className="hidden"
            />
            <button
              onClick={() => {
                if (!uploadCat) return showToast(t.toastSelectCategory);
                fileRef.current?.click();
              }}
              className="w-full bg-purple-600/30 border border-purple-500/40 text-purple-200 py-2.5 rounded-xl text-xs font-bold hover:bg-purple-600/50"
            >
              + {uploadCat ? `${uploadCat} 사진 선택` : t.toastSelectCategory}
            </button>
          </section>

          {/* Outfit Recommendation */}
          <section className="bg-gray-900/40 p-4 rounded-2xl border border-gray-800">
            <div className="flex justify-between items-center mb-3">
              <h2 className="text-sm font-bold">{t.recommendTitle}</h2>
              <button
                onClick={generateOutfit}
                className="text-xs bg-purple-600 px-3 py-1.5 rounded-lg font-bold"
              >
                {t.retry}
              </button>
            </div>

            {outfitItems.length === 0 ? (
              <div className="text-center py-6 text-xs text-gray-500">
                버튼을 눌러 추천 코디를 조합해보세요.
              </div>
            ) : (
              <div className="grid grid-cols-3 gap-2">
                {outfitItems.map((item) => (
                  <div key={item.id} className="bg-gray-800 rounded-xl overflow-hidden border border-gray-700">
                    <img src={item.imageUrl} alt={item.name} className="w-full h-24 object-cover" />
                    <div className="p-1.5 text-center">
                      <p className="text-[10px] text-purple-400 font-bold">{item.category}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StyleSync />);
  </script>
</body>
</html>
